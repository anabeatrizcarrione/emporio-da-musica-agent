[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer-service agent prototype for Empório da Música (Artefact AI Engineer challenge)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
